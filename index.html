<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>兵峰射击游戏 - 肉鸽版</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#0a0f0a; touch-action:none; }
        #game { display:block; width:100vw; height:100vh; background:#0f172a; touch-action:none; z-index:1; }
        #upgrade-overlay { position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(15,23,42,0.95); display:none; flex-direction:column; justify-content:center; align-items:center; z-index:200; color:#e0f2fe; padding:20px; }
        .upgrade-title { font-size:26px; margin-bottom:20px; color:#22c55e; }
        .upgrade-btn { background:#166534; color:white; border:2px solid #4ade80; padding:16px 24px; margin:10px 0; font-size:18px; border-radius:12px; width:90%; max-width:320px; text-align:center; }
        .upgrade-btn:active { background:#4ade80; color:#0f172a; }

        /* Virtual Joystick - fixed positioning */
        #joystick-container {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            width: 160px;
            height: 160px;
            z-index: 150;
            pointer-events: none; /* container doesn't block */
        }
        #joystick-base {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 130px;
            height: 130px;
            background: rgba(71, 85, 105, 0.35);
            border: 4px solid #64748b;
            border-radius: 50%;
            pointer-events: auto;
        }
        #joystick-knob {
            position: absolute;
            bottom: 55px;
            left: 50%;
            transform: translateX(-50%);
            width: 52px;
            height: 52px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 4px 12px rgba(34, 197, 94, 0.5);
            pointer-events: none;
            transition: transform 0.05s ease-out;
        }
    </style>
</head>
<body>
    <canvas id="game"></canvas>

    <div id="upgrade-overlay">
        <div class="upgrade-title">选择升级 / 武器</div>
        <div id="upgrade-options"></div>
    </div>

    <!-- Virtual Joystick -->
    <div id="joystick-container">
        <div id="joystick-base"></div>
        <div id="joystick-knob"></div>
    </div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
        const upgradeOverlay = document.getElementById('upgrade-overlay');
        const upgradeOptions = document.getElementById('upgrade-options');
        const joystickContainer = document.getElementById('joystick-container');
        const joystickBase = document.getElementById('joystick-base');
        const joystickKnob = document.getElementById('joystick-knob');

        let gameState = 'start';
        let score = 0;
        let currentWave = 1;
        let enemiesKilledThisWave = 0;
        let waveEnemyTarget = 10;

        let player = { x: 400, y: 300, radius: 14, speed: 3.8, health: 100, maxHealth: 100, angle: 0 };
        let playerStats = { fireCooldown: 260, damage: 1, moveSpeed: 3.8, multiShot: 1 };
        let currentWeapon = 'pistol';
        let weaponLevel = 1;

        let bullets = [];
        let enemies = [];
        let particles = [];
        let lastShotTime = 0;
        let lastMeleeTime = 0;

        let joystickActive = false;
        let joystickDir = { x: 0, y: 0 };
        let joystickTouchId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', resizeCanvas);

        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

        function playShootSound() {
            initAudio();
            try {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = currentWeapon === 'melee' ? 'sine' : 'sawtooth';
                o.frequency.value = currentWeapon === 'melee' ? 160 : 820;
                g.gain.value = 0.2;
                o.connect(g); g.connect(audioCtx.destination);
                o.start();
                setTimeout(() => {
                    g.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
                    o.stop(audioCtx.currentTime + 0.15);
                }, 30);
            } catch(e){}
        }

        function createExplosion(x, y, size = 1) {
            for (let i = 0; i < 10; i++) {
                const ang = Math.random() * Math.PI * 2;
                particles.push({
                    x, y,
                    vx: Math.cos(ang) * (2 + Math.random() * 2.5) * size,
                    vy: Math.sin(ang) * (2 + Math.random() * 2.5) * size,
                    life: 22 + Math.random() * 15,
                    size: 2.8 * size
                });
            }
        }

        function findNearestEnemy() {
            if (enemies.length === 0) return null;
            let nearest = null, minD = Infinity;
            for (let e of enemies) {
                const d = Math.hypot(e.x - player.x, e.y - player.y);
                if (d < minD) { minD = d; nearest = e; }
            }
            return nearest;
        }

        function shoot() {
            const nearest = findNearestEnemy();
            if (!nearest) return;
            const angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
            const bulletSpeed = currentWeapon === 'shotgun' ? 8 : 11;
            const startDist = player.radius + 10;

            let count = (currentWeapon === 'shotgun') ? 5 : playerStats.multiShot;
            let spread = (currentWeapon === 'shotgun') ? 0.38 : 0;

            for (let i = 0; i < count; i++) {
                let a = angle + (i - (count-1)/2) * spread;
                bullets.push({
                    x: player.x + Math.cos(a) * startDist,
                    y: player.y + Math.sin(a) * startDist,
                    vx: Math.cos(a) * bulletSpeed,
                    vy: Math.sin(a) * bulletSpeed,
                    damage: playerStats.damage * (currentWeapon === 'shotgun' ? 0.65 : 1),
                    life: 45
                });
            }
            lastShotTime = Date.now();
            playShootSound();
        }

        function doMeleeAttack() {
            const now = Date.now();
            if (now - lastMeleeTime < 420) return;
            let hitAny = false;
            for (let i = enemies.length-1; i>=0; i--) {
                const e = enemies[i];
                if (Math.hypot(e.x - player.x, e.y - player.y) < 58) {
                    e.health = (e.health || 1) - playerStats.damage * 2.5;
                    createExplosion(e.x, e.y, 0.9);
                    if (e.health <= 0) {
                        enemies.splice(i,1);
                        score += 12;
                        enemiesKilledThisWave++;
                    }
                    hitAny = true;
                }
            }
            if (hitAny) lastMeleeTime = now;
        }

        function update() {
            if (gameState !== 'playing') return;

            // Joystick movement
            if (joystickActive) {
                player.x += joystickDir.x * playerStats.moveSpeed;
                player.y += joystickDir.y * playerStats.moveSpeed;
            }

            player.x = Math.max(25, Math.min(canvas.width-25, player.x));
            player.y = Math.max(25, Math.min(canvas.height-25, player.y));

            const nearest = findNearestEnemy();
            if (nearest) {
                player.angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
            }

            const now = Date.now();
            if (currentWeapon === 'melee') {
                doMeleeAttack();
            } else if (nearest && now - lastShotTime > playerStats.fireCooldown) {
                shoot();
            }

            // Bullets
            for (let i=bullets.length-1; i>=0; i--) {
                const b = bullets[i];
                b.x += b.vx; b.y += b.vy; b.life--;
                if (b.life <= 0 || b.x<0 || b.x>canvas.width || b.y<0 || b.y>canvas.height) bullets.splice(i,1);
            }

            // Enemies
            for (let i=enemies.length-1; i>=0; i--) {
                const e = enemies[i];
                const dx = player.x - e.x, dy = player.y - e.y;
                const d = Math.hypot(dx, dy) || 1;
                e.x += (dx/d) * e.speed;
                e.y += (dy/d) * e.speed;

                if (Math.hypot(e.x-player.x, e.y-player.y) < player.radius + e.radius + 4) {
                    player.health -= 15;
                    createExplosion(e.x, e.y);
                    enemies.splice(i,1);
                    if (player.health <= 0) gameState = 'gameover';
                }
            }

            // Bullet collision
            for (let bi=bullets.length-1; bi>=0; bi--) {
                const b = bullets[bi];
                for (let ei=enemies.length-1; ei>=0; ei--) {
                    const e = enemies[ei];
                    if (Math.hypot(b.x-e.x, b.y-e.y) < 10) {
                        e.health = (e.health||1) - b.damage;
                        createExplosion(e.x, e.y, 0.6);
                        bullets.splice(bi,1);
                        if (e.health <= 0) {
                            enemies.splice(ei,1);
                            score += 10;
                            enemiesKilledThisWave++;
                        }
                        break;
                    }
                }
            }

            // Particles
            for (let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                if (p.life <= 0) particles.splice(i,1);
            }

            // Spawn
            if (enemies.length < 13 && enemiesKilledThisWave < waveEnemyTarget && Date.now() - lastSpawnTime > 720) {
                spawnEnemy();
                lastSpawnTime = Date.now();
            }

            if (enemiesKilledThisWave >= waveEnemyTarget && enemies.length === 0) {
                showUpgradeScreen();
            }
        }

        function spawnEnemy() {
            const side = Math.floor(Math.random()*4);
            let x,y;
            if(side===0){x=Math.random()*canvas.width;y=-25;}
            else if(side===1){x=canvas.width+25;y=Math.random()*canvas.height;}
            else if(side===2){x=Math.random()*canvas.width;y=canvas.height+25;}
            else{x=-25;y=Math.random()*canvas.height;}
            enemies.push({x,y,radius:13,speed:1.55+currentWave*0.1,health:1+Math.floor(currentWave/2)});
        }

        function drawHero() {
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);

            ctx.fillStyle = 'rgba(0,0,0,0.25)';
            ctx.beginPath(); ctx.ellipse(0,7,9,4.5,0,0,Math.PI*2); ctx.fill();

            ctx.fillStyle = '#334155';
            ctx.fillRect(-5,1,4,11);
            ctx.fillRect(1,1,4,11);

            ctx.fillStyle = '#166534';
            ctx.fillRect(-6,-5,12,9);

            ctx.fillStyle = '#4ade80';
            ctx.beginPath(); ctx.arc(0,-8,5.5,0,Math.PI*2); ctx.fill();

            ctx.fillStyle = '#22c55e';
            ctx.beginPath(); ctx.arc(0,-9,3.5,0,Math.PI*2); ctx.fill();

            // Weapon
            if (currentWeapon === 'melee') {
                ctx.strokeStyle = '#e2e8f0';
                ctx.lineWidth = 3.5;
                ctx.beginPath();
                ctx.moveTo(4,-1);
                ctx.lineTo(17,-7);
                ctx.stroke();
            } else {
                ctx.fillStyle = '#64748b';
                ctx.fillRect(5,-2.5,15,5);
            }
            ctx.restore();
        }

        function draw() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0,0,canvas.width,canvas.height);

            ctx.strokeStyle = '#1e2937';
            ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=48){ ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=0; y<canvas.height; y+=48){ ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

            for(let e of enemies){
                ctx.fillStyle = '#ef4444';
                ctx.beginPath(); ctx.arc(e.x,e.y,e.radius,0,Math.PI*2); ctx.fill();
            }

            drawHero();

            ctx.fillStyle = '#facc15';
            for(let b of bullets){ ctx.beginPath(); ctx.arc(b.x,b.y,4,0,Math.PI*2); ctx.fill(); }

            for(let p of particles){
                ctx.globalAlpha = Math.max(0.2, p.life/28);
                ctx.fillStyle = '#fb923c';
                ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
            }
            ctx.globalAlpha = 1;

            ctx.fillStyle = '#e0f2fe';
            ctx.font = 'bold 20px system-ui';
            ctx.fillText('HP ' + Math.floor(player.health), 18, 30);
            ctx.fillText('Wave ' + currentWave, canvas.width - 95, 30);
            ctx.fillText(currentWeapon.toUpperCase() + ' Lv' + weaponLevel, 18, 55);
        }

        function gameLoop() {
            if(gameState === 'playing') update();
            draw();

            if(gameState === 'start'){
                ctx.fillStyle = 'rgba(15,23,42,0.9)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#22c55e';
                ctx.font = 'bold 40px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('兵峰射击游戏', canvas.width/2, canvas.height*0.33);
                ctx.font = '18px system-ui';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText('虚拟摇杆控制移动 | 自动战斗', canvas.width/2, canvas.height*0.43);
                ctx.fillStyle = '#4ade80';
                ctx.fillText('点击屏幕开始', canvas.width/2, canvas.height*0.56);
                ctx.textAlign = 'left';
            }

            if(gameState === 'gameover'){
                ctx.fillStyle = 'rgba(15,23,42,0.92)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 44px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束', canvas.width/2, canvas.height*0.33);
                ctx.fillStyle = '#e0f2fe';
                ctx.font = '24px system-ui';
                ctx.fillText('最终得分: ' + score, canvas.width/2, canvas.height*0.46);
                ctx.fillStyle = '#94a3b8';
                ctx.fillText('点击屏幕重新开始', canvas.width/2, canvas.height*0.58);
            }

            requestAnimationFrame(gameLoop);
        }

        function startNewRun() {
            player.x = canvas.width * 0.5;
            player.y = canvas.height * 0.52;
            player.health = player.maxHealth;
            score = 0;
            currentWave = 1;
            enemiesKilledThisWave = 0;
            waveEnemyTarget = 10;
            bullets = []; enemies = []; particles = [];
            lastShotTime = 0; lastMeleeTime = 0;
            currentWeapon = 'pistol';
            weaponLevel = 1;
            playerStats = { fireCooldown: 260, damage: 1, moveSpeed: 3.8, multiShot: 1 };
            gameState = 'playing';
            joystickActive = false;
            joystickDir = {x:0, y:0};
            resetJoystickVisual();
        }

        function showUpgradeScreen() {
            gameState = 'upgrading';
            upgradeOptions.innerHTML = '';

            const opts = [
                {n:'手枪升级', d:'射速上升 + 伤害', f:()=>{currentWeapon='pistol'; playerStats.fireCooldown*=0.8; playerStats.damage+=0.7; weaponLevel++;}},
                {n:'霰弹枪', d:'切换为散弹武器', f:()=>{currentWeapon='shotgun'; weaponLevel=1;}},
                {n:'近战剑', d:'切换为近身战斗', f:()=>{currentWeapon='melee'; weaponLevel=1;}},
                {n:'移动加速', d:'移动速度提升', f:()=>{playerStats.moveSpeed *= 1.2;}},
                {n:'提升伤害', d:'全体伤害 +1', f:()=>{playerStats.damage += 1;}}
            ];
            const chosen = opts.sort(()=>Math.random()-0.5).slice(0,3);

            chosen.forEach(o => {
                const b = document.createElement('div');
                b.className = 'upgrade-btn';
                b.innerHTML = `<strong>${o.n}</strong><br><small>${o.d}</small>`;
                b.onclick = () => {
                    o.f();
                    upgradeOverlay.style.display='none';
                    currentWave++;
                    enemiesKilledThisWave=0;
                    waveEnemyTarget = 10 + currentWave*4;
                    gameState = 'playing';
                };
                upgradeOptions.appendChild(b);
            });
            upgradeOverlay.style.display = 'flex';
        }

        function updateJoystickVisual(dx, dy) {
            const maxMove = 32;
            joystickKnob.style.left = `calc(50% + ${dx * maxMove}px)`;
            joystickKnob.style.bottom = `calc(55px - ${dy * maxMove}px)`;
        }

        function resetJoystickVisual() {
            joystickKnob.style.left = '50%';
            joystickKnob.style.bottom = '55px';
        }

        function updateJoystickFromTouch(clientX, clientY) {
            const rect = joystickBase.getBoundingClientRect();
            const cx = rect.left + rect.width/2;
            const cy = rect.top + rect.height/2;

            let dx = clientX - cx;
            let dy = clientY - cy;
            const dist = Math.hypot(dx, dy);
            const max = 48;

            if (dist > max) {
                dx = dx / dist * max;
                dy = dy / dist * max;
            }

            joystickDir.x = dx / max;
            joystickDir.y = dy / max;

            updateJoystickVisual(joystickDir.x, joystickDir.y);
        }

        function resetJoystick() {
            joystickActive = false;
            joystickDir = {x:0, y:0};
            resetJoystickVisual();
        }

        // === Touch Handling (Fixed) ===
        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];

            // Priority: Start or Game Over screen
            if (gameState === 'start' || gameState === 'gameover') {
                startNewRun();
                return;
            }

            // Joystick area check
            const rect = joystickBase.getBoundingClientRect();
            const inJoystick = (touch.clientX > rect.left - 25 && touch.clientX < rect.right + 25 &&
                              touch.clientY > rect.top - 25 && touch.clientY < rect.bottom + 25);

            if (inJoystick) {
                joystickActive = true;
                joystickTouchId = touch.identifier;
                updateJoystickFromTouch(touch.clientX, touch.clientY);
            }
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!joystickActive) return;

            for (let t of e.touches) {
                if (t.identifier === joystickTouchId) {
                    updateJoystickFromTouch(t.clientX, t.clientY);
                    break;
                }
            }
        }

        function handleTouchEnd(e) {
            e.preventDefault();
            for (let t of e.changedTouches) {
                if (t.identifier === joystickTouchId) {
                    resetJoystick();
                    joystickTouchId = null;
                    break;
                }
            }
        }

        canvas.addEventListener('touchstart', handleTouchStart, {passive:false});
        canvas.addEventListener('touchmove', handleTouchMove, {passive:false});
        canvas.addEventListener('touchend', handleTouchEnd, {passive:false});

        // Mouse fallback
        canvas.addEventListener('mousedown', (e) => {
            if (gameState === 'start' || gameState === 'gameover') {
                startNewRun();
            }
        });

        canvas.addEventListener('contextmenu', e => e.preventDefault());

        resizeCanvas();
        gameLoop();
    </script>
</body>
</html>
