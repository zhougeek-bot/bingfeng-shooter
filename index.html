<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>兵峰射击游戏 - 肉鸽版</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body { width:100%; height:100%; overflow:hidden; background:#0a0f0a; touch-action:none; }
        #game { 
            display:block; 
            width:100vw; 
            height:100vh; 
            border:none; 
            background:#0f172a;
            touch-action: none;
        }
        #upgrade-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.92);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 200;
            color: #e0f2fe;
            padding: 20px;
        }
        .upgrade-title { font-size: 28px; margin-bottom: 30px; color: #22c55e; }
        .upgrade-btn {
            background: #166534;
            color: white;
            border: 2px solid #4ade80;
            padding: 18px 30px;
            margin: 12px 0;
            font-size: 20px;
            border-radius: 12px;
            width: 85%;
            max-width: 320px;
            cursor: pointer;
            text-align: center;
        }
        .upgrade-btn:active { background: #4ade80; color: #0f172a; }
        .wave-text { position: absolute; top: 20px; left: 50%; transform: translateX(-50%); color: #94a3b8; font-size: 18px; z-index: 100; }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="upgrade-overlay">
        <div class="upgrade-title">选择升级</div>
        <div id="upgrade-options"></div>
    </div>
    <div class="wave-text" id="wave-display"></div>

    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d', { alpha: true, desynchronized: true });
        const upgradeOverlay = document.getElementById('upgrade-overlay');
        const upgradeOptions = document.getElementById('upgrade-options');
        const waveDisplay = document.getElementById('wave-display');

        let gameState = 'start'; // start, playing, upgrading, gameover
        let score = 0;
        let currentWave = 1;
        let enemiesKilledThisWave = 0;
        let waveEnemyTarget = 8;

        // Player stats (roguelike upgrades)
        let player = { 
            x: 400, y: 300, radius: 20, 
            speed: 4.5, 
            health: 100, maxHealth: 100,
            angle: 0 
        };
        let playerStats = {
            fireCooldown: 280,      // ms between shots
            damage: 1,
            moveSpeed: 4.5,
            multiShot: 1            // number of bullets per shot
        };

        let bullets = [];
        let enemies = [];
        let particles = [];
        let lastShotTime = 0;
        let lastSpawnTime = 0;
        let spawnInterval = 900;

        let touchActive = false;
        let touchTargetX = 400;
        let touchTargetY = 300;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            // Keep logical game area centered
        }

        window.addEventListener('resize', resizeCanvas);
        window.addEventListener('load', () => {
            resizeCanvas();
            // Auto enter fullscreen on mobile if possible
            if (document.documentElement.requestFullscreen) {
                // Will be triggered on first touch
            }
        });

        function getGameScale() {
            // Scale touch coordinates to logical 800x600 space for simplicity
            return { scaleX: 800 / canvas.width, scaleY: 600 / canvas.height };
        }

        // Simple audio
        let audioCtx;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playShoot() { /* keep simple beeps */ }
        function playHit() { /* ... */ }

        function shootToward(targetX, targetY) {
            const angle = Math.atan2(targetY - player.y, targetX - player.x);
            const bulletSpeed = 10;
            const startDist = player.radius + 12;

            for (let i = 0; i < playerStats.multiShot; i++) {
                let spread = (i - (playerStats.multiShot-1)/2) * 0.12;
                const finalAngle = angle + spread;

                bullets.push({
                    x: player.x + Math.cos(finalAngle) * startDist,
                    y: player.y + Math.sin(finalAngle) * startDist,
                    vx: Math.cos(finalAngle) * bulletSpeed,
                    vy: Math.sin(finalAngle) * bulletSpeed,
                    damage: playerStats.damage
                });
            }
            lastShotTime = Date.now();
            // Simple sound
            initAudio();
            try {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.frequency.value = 850; o.type = 'sawtooth';
                g.gain.value = 0.2;
                o.connect(g); g.connect(audioCtx.destination);
                o.start(); setTimeout(() => { g.gain.linearRampToValueAtTime(0.001, audioCtx.currentTime + 0.12); o.stop(audioCtx.currentTime + 0.15); }, 30);
            } catch(e){}
        }

        function findNearestEnemy() {
            if (enemies.length === 0) return null;
            let nearest = enemies[0];
            let minDist = Infinity;
            for (let e of enemies) {
                const d = Math.hypot(e.x - player.x, e.y - player.y);
                if (d < minDist) { minDist = d; nearest = e; }
            }
            return nearest;
        }

        function update() {
            if (gameState !== 'playing') return;

            // === Movement (touch controlled) ===
            if (touchActive) {
                const dx = touchTargetX - player.x;
                const dy = touchTargetY - player.y;
                const dist = Math.hypot(dx, dy);
                if (dist > 8) {
                    const move = Math.min(playerStats.moveSpeed, dist);
                    player.x += (dx / dist) * move;
                    player.y += (dy / dist) * move;
                }
            }

            // Clamp
            player.x = Math.max(30, Math.min(canvas.width - 30, player.x));
            player.y = Math.max(30, Math.min(canvas.height - 30, player.y));

            // === Auto Aim + Auto Shoot ===
            const nearest = findNearestEnemy();
            if (nearest) {
                player.angle = Math.atan2(nearest.y - player.y, nearest.x - player.x);
                const now = Date.now();
                if (now - lastShotTime > playerStats.fireCooldown) {
                    shootToward(nearest.x, nearest.y);
                }
            }

            // Update bullets
            for (let i = bullets.length-1; i>=0; i--) {
                const b = bullets[i];
                b.x += b.vx; b.y += b.vy;
                if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(i,1);
            }

            // Update enemies
            for (let i = enemies.length-1; i>=0; i--) {
                const e = enemies[i];
                const dx = player.x - e.x;
                const dy = player.y - e.y;
                const d = Math.hypot(dx, dy) || 1;
                e.x += (dx/d) * e.speed;
                e.y += (dy/d) * e.speed;

                if (Math.hypot(e.x-player.x, e.y-player.y) < player.radius + e.radius) {
                    player.health -= 18;
                    createExplosion(e.x, e.y);
                    enemies.splice(i,1);
                    if (player.health <= 0) { gameState = 'gameover'; }
                }
            }

            // Bullet collision
            for (let bi=bullets.length-1; bi>=0; bi--) {
                const b = bullets[bi];
                for (let ei=enemies.length-1; ei>=0; ei--) {
                    const e = enemies[ei];
                    if (Math.hypot(b.x-e.x, b.y-e.y) < 12) {
                        e.health = (e.health || 1) - b.damage;
                        createExplosion(e.x, e.y);
                        bullets.splice(bi,1);
                        if (e.health <= 0) {
                            enemies.splice(ei,1);
                            score += 15;
                            enemiesKilledThisWave++;
                        }
                        break;
                    }
                }
            }

            // Particles
            for (let i=particles.length-1; i>=0; i--) {
                const p = particles[i];
                p.x += p.vx; p.y += p.vy; p.life--;
                if (p.life <= 0) particles.splice(i,1);
            }

            // Spawn enemies
            const now = Date.now();
            if (enemies.length < 12 && now - lastSpawnTime > spawnInterval && enemiesKilledThisWave < waveEnemyTarget) {
                spawnEnemy();
                lastSpawnTime = now;
            }

            // Check wave clear
            if (enemiesKilledThisWave >= waveEnemyTarget && enemies.length === 0) {
                showUpgradeScreen();
            }

            // Update wave display
            waveDisplay.textContent = `第 ${currentWave} 波 | 得分: ${score}`;
        }

        function spawnEnemy() {
            const side = Math.floor(Math.random()*4);
            let x,y;
            if (side===0) {x=Math.random()*canvas.width; y=-30;}
            else if (side===1){x=canvas.width+30; y=Math.random()*canvas.height;}
            else if (side===2){x=Math.random()*canvas.width; y=canvas.height+30;}
            else {x=-30; y=Math.random()*canvas.height;}

            enemies.push({
                x, y,
                radius: 16,
                speed: 1.6 + currentWave * 0.12,
                health: 1 + Math.floor(currentWave / 3)
            });
        }

        function createExplosion(x, y) {
            for(let i=0; i<10; i++){
                const ang = Math.random()*Math.PI*2;
                particles.push({x,y, vx:Math.cos(ang)* (2+Math.random()*3), vy:Math.sin(ang)*(2+Math.random()*3), life:25+Math.random()*15, size:3});
            }
        }

        function draw() {
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0,0,canvas.width,canvas.height);

            // Grid
            ctx.strokeStyle = '#1e2937';
            ctx.lineWidth = 1;
            for(let x=0; x<canvas.width; x+=45) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,canvas.height); ctx.stroke(); }
            for(let y=0; y<canvas.height; y+=45) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(canvas.width,y); ctx.stroke(); }

            // Enemies
            ctx.fillStyle = '#ef4444';
            for(let e of enemies){
                ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI*2); ctx.fill();
            }

            // Player + Turret
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            // Body
            ctx.fillStyle = '#22c55e';
            ctx.beginPath(); ctx.arc(0,0,player.radius,0,Math.PI*2); ctx.fill();
            // Turret
            ctx.fillStyle = '#166534';
            ctx.fillRect(8, -6, 32, 12);
            ctx.restore();

            // Bullets
            ctx.fillStyle = '#facc15';
            for(let b of bullets){
                ctx.beginPath(); ctx.arc(b.x,b.y,5,0,Math.PI*2); ctx.fill();
            }

            // Particles
            ctx.fillStyle = '#f97316';
            for(let p of particles){
                ctx.globalAlpha = p.life / 35;
                ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,Math.PI*2); ctx.fill();
            }
            ctx.globalAlpha = 1;

            // UI
            ctx.fillStyle = '#e0f2fe';
            ctx.font = 'bold 22px system-ui';
            ctx.fillText(`HP: ${Math.max(0, Math.floor(player.health))}`, 20, 35);
            ctx.fillText(`第${currentWave}波`, canvas.width - 90, 35);
        }

        function gameLoop() {
            if (gameState === 'playing') update();
            draw();

            if (gameState === 'start') {
                ctx.fillStyle = 'rgba(15,23,42,0.85)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#22c55e';
                ctx.font = 'bold 42px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('兵峰射击游戏', canvas.width/2, canvas.height*0.35);
                ctx.font = '22px system-ui';
                ctx.fillStyle = '#bae6fd';
                ctx.fillText('触摸屏幕移动 | 自动瞄准射击', canvas.width/2, canvas.height*0.45);
                ctx.font = '20px system-ui';
                ctx.fillStyle = '#4ade80';
                ctx.fillText('点击开始', canvas.width/2, canvas.height*0.6);
                ctx.textAlign = 'left';
            }

            if (gameState === 'gameover') {
                ctx.fillStyle = 'rgba(15,23,42,0.9)';
                ctx.fillRect(0,0,canvas.width,canvas.height);
                ctx.fillStyle = '#ef4444';
                ctx.font = 'bold 48px system-ui';
                ctx.textAlign = 'center';
                ctx.fillText('游戏结束', canvas.width/2, canvas.height*0.35);
                ctx.fillStyle = '#e0f2fe';
                ctx.font = '26px system-ui';
                ctx.fillText(`最终得分: ${score}`, canvas.width/2, canvas.height*0.48);
                ctx.font = '20px system-ui';
                ctx.fillStyle = '#94a3b8';
                ctx.fillText('点击重新开始', canvas.width/2, canvas.height*0.6);
            }

            requestAnimationFrame(gameLoop);
        }

        function startNewRun() {
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            player.health = player.maxHealth;
            score = 0;
            currentWave = 1;
            enemiesKilledThisWave = 0;
            waveEnemyTarget = 8;
            bullets = []; enemies = []; particles = [];
            lastShotTime = 0;
            lastSpawnTime = Date.now();
            spawnInterval = 900;
            playerStats = { fireCooldown: 280, damage: 1, moveSpeed: 4.5, multiShot: 1 };
            gameState = 'playing';
            waveDisplay.style.display = 'block';
        }

        function showUpgradeScreen() {
            gameState = 'upgrading';
            upgradeOptions.innerHTML = '';

            const upgrades = [
                { name: '快速射击', desc: '射速 +25%', effect: () => { playerStats.fireCooldown = Math.max(120, playerStats.fireCooldown * 0.75); } },
                { name: '增加伤害', desc: '弹弹伤害 +1', effect: () => { playerStats.damage += 1; } },
                { name: '多重射击', desc: '一次发射 2 发', effect: () => { playerStats.multiShot = Math.min(3, playerStats.multiShot + 1); } },
                { name: '移动加速', desc: '移动速度 +15%', effect: () => { playerStats.moveSpeed *= 1.15; } }
            ];

            // Pick 3 random
            const chosen = upgrades.sort(() => 0.5 - Math.random()).slice(0, 3);

            chosen.forEach(up => {
                const btn = document.createElement('div');
                btn.className = 'upgrade-btn';
                btn.innerHTML = `<strong>${up.name}</strong><br><small>${up.desc}</small>`;
                btn.onclick = () => {
                    up.effect();
                    upgradeOverlay.style.display = 'none';
                    // Next wave
                    currentWave++;
                    enemiesKilledThisWave = 0;
                    waveEnemyTarget = 8 + currentWave * 3;
                    spawnInterval = Math.max(450, spawnInterval - 60);
                    gameState = 'playing';
                    lastSpawnTime = Date.now();
                };
                upgradeOptions.appendChild(btn);
            });

            upgradeOverlay.style.display = 'flex';
        }

        // Touch controls - only movement
        function handleTouch(e) {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            const touch = e.touches[0] || e.changedTouches[0];
            touchTargetX = (touch.clientX - rect.left);
            touchTargetY = (touch.clientY - rect.top);
            touchActive = true;

            if (gameState === 'start') {
                startNewRun();
            } else if (gameState === 'gameover') {
                startNewRun();
            }
        }

        canvas.addEventListener('touchstart', handleTouch, {passive: false});
        canvas.addEventListener('touchmove', handleTouch, {passive: false});
        canvas.addEventListener('touchend', () => { touchActive = false; }, {passive: false});

        // Also allow mouse for testing
        canvas.addEventListener('mousedown', (e) => {
            if (gameState === 'start' || gameState === 'gameover') {
                startNewRun();
            }
            touchActive = true;
            touchTargetX = e.offsetX;
            touchTargetY = e.offsetY;
        });
        canvas.addEventListener('mousemove', (e) => {
            if (touchActive) {
                touchTargetX = e.offsetX;
                touchTargetY = e.offsetY;
            }
        });
        canvas.addEventListener('mouseup', () => touchActive = false);

        // Prevent context menu
        canvas.addEventListener('contextmenu', e => e.preventDefault());

        // Initial resize
        resizeCanvas();

        // Start loop
        gameLoop();

        // Show start hint
        setTimeout(() => {
            if (gameState === 'start') {
                // already drawn in loop
            }
        }, 500);
    </script>
</body>
</html>
